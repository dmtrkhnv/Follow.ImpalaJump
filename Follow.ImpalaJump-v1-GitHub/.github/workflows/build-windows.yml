name: Build and publish Windows v1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --collect-all selenium --icon "favicon.ico" --name "Follow.ImpalaJump" follow_impalajump.py

      - name: Create release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Follow.ImpalaJump.exe release/Follow.ImpalaJump.exe
          Copy-Item README.md release/README.md
          Copy-Item LICENSE release/LICENSE
          Compress-Archive -Path release/* -DestinationPath Follow.ImpalaJump-Windows.zip -Force

      - name: Recreate v1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1 --yes --cleanup-tag 2>$null
          gh release create v1 Follow.ImpalaJump-Windows.zip --title "Follow.ImpalaJump v1" --notes-file RELEASE_NOTES.md --latest

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Follow.ImpalaJump-Windows
          path: Follow.ImpalaJump-Windows.zip
